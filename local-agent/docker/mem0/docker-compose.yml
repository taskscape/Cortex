services:
  mem0-api:
    image: mem0/mem0-api-server:latest
    env_file:
      - .env.example
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: mem0
      POSTGRES_USER: mem0
      POSTGRES_PASSWORD: mem0-local
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: mem0-local-password
    ports:
      - "8888:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: mem0
      POSTGRES_USER: mem0
      POSTGRES_PASSWORD: mem0-local
    ports:
      - "5432:5432"
    volumes:
      - mem0-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mem0 -d mem0"]
      interval: 5s
      timeout: 3s
      retries: 20

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/mem0-local-password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - mem0-neo4j:/data

volumes:
  mem0-postgres:
  mem0-neo4j:
